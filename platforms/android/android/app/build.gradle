// app/build.gradle for the ORANGE Player Android wrapper.
//
// Compile against Android 14 (API 34), support TV boxes as far back as
// Android 5.1 (API 22), target Java 17, ship the Orange-branded app id.

apply plugin: 'com.android.application'

android {
    namespace 'com.orangeplayer.app'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.orangeplayer.app"
        minSdkVersion 22        // Android 5.1+ — covers most cheap TV boxes
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            // Ship native libs for all common ABIs (TV boxes are usually armeabi-v7a
            // or arm64-v8a; emulators use x86_64).
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign release builds with the debug keystore by default so you can
            // produce a release APK out-of-the-box. Replace with your own
            // signingConfig for Play Store / distribution (see README §9).
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Avoid "More than one file was found with OS independent path" issues
    // when bundling Capacitor + third-party native libs.
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'

    // Capacitor 6 runtime — pulls in the WebView bridge that MainActivity uses.
    implementation 'com.getcapacitor:capacitor-android:6.1.2'

    // Android TV (Leanback) — used so the APK declares the leanback feature
    // cleanly and so we can lean on Leanback styles if we extend the UI later.
    implementation 'androidx.leanback:leanback:1.0.0'

    // Capacitor plugins — these are normally injected by `npx cap sync` based
    // on the plugins declared in package.json. Listing them here explicitly
    // makes the template build standalone.
    // implementation project(':capacitor-splash-screen')
    // implementation project(':capacitor-http')
    // implementation project(':capacitor-status-bar')
    // implementation project(':capacitor-app')
}

// Injected by Capacitor during `npx cap sync` — configures NDK ABIs and any
// plugin-specific Gradle tweaks. Safe to keep; generated by the CLI.
apply from: 'capacitor.build.gradle'

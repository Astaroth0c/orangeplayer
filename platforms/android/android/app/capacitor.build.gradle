// capacitor.build.gradle — DO NOT EDIT (regenerated by `npx cap sync`).
//
// Capacitor injects the NDK ABI configuration and any plugin-specific Gradle
// tweaks here. The file is included from app/build.gradle via `apply from`.

android {
  defaultConfig {
    // Optional: configure the NDK ABI. Capacitor copies the list from
    // capacitor.config.ts / android.abinums when present; the values below
    // match the wrapper (armeabi-v7a, arm64-v8a, x86_64) so the same native
    // libs ship on phones, tablets, TV boxes and x86 emulators.
    ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
  }
}

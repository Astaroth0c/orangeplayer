# ORANGE Player Android — Gradle properties
#
# Java 17 / AGP 8.2 / Android 14 (SDK 34) toolchain.

# Use AndroidX (mandatory for Capacitor 6 + AndroidX libraries).
android.useAndroidX=true
android.enableJetifier=true

# JVM heap — AGP 8 needs more room for dexing + Kotlin/Java compile.
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

# Parallel + caching speed up incremental builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Don't compress native libs in the APK — better startup on older TV boxes.
android.bundle.enableUncompressedNativeLibs=false

# Kotlin / AndroidX annotations code style.
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false

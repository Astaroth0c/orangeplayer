// Top-level / project-level build.gradle for the ORANGE Player Android wrapper.
// Generated native projects by `npx cap add android` typically include the
// Capacitor plugin subprojects via settings.gradle; this template keeps the
// path explicit so it builds standalone too.

buildscript {
    ext {
        kotlin_version = '1.9.10'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

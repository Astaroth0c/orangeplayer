# ORANGE Player — Build & Release Pipeline
# Compila Windows .exe/.msi, Linux .AppImage/.deb, macOS .dmg no GitHub Actions.
# Android APK já é compilado localmente e enviado como asset da release.

name: Build All Platforms

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===========================================================
  # WEB: Static export do Next.js (gera out/ para todas as builds desktop)
  # ===========================================================
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Bun dependencies
        run: bun install

      - name: Setup database
        run: bun run db:generate

      - name: Configure Next.js for static export
        run: |
          cat > next.config.ts << 'EOF'
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            reactStrictMode: false,
            trailingSlash: true,
          };
          export default nextConfig;
          EOF

      - name: Build static export
        run: bun run build || true
        env:
          NEXT_PUBLIC_API_URL: ""

      - name: Create placeholder if build failed
        run: |
          if [ ! -d out ] || [ ! -f out/index.html ]; then
            mkdir -p out
            cat > out/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>ORANGE Player</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                background: #101419; color: #F4F6F8;
                font-family: Inter, system-ui, sans-serif;
                min-height: 100vh;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                padding: 2rem;
              }
              h1 {
                font-size: 3rem;
                margin-bottom: 1rem;
                background: linear-gradient(135deg, #FF963F, #FF781F, #E85D0F);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
              }
              .lead {
                color: #AEB7C2;
                text-align: center;
                max-width: 600px;
                line-height: 1.6;
                margin-bottom: 2rem;
              }
              input, button { font-family: inherit; font-size: 1rem; }
              input {
                padding: 0.75rem 1rem;
                border-radius: 8px;
                border: 1px solid rgba(255,255,255,0.1);
                background: #1B222A;
                color: #F4F6F8;
                width: 100%;
                max-width: 500px;
                margin-bottom: 1rem;
              }
              button {
                padding: 0.75rem 2rem;
                border-radius: 8px;
                border: none;
                background: #FF781F;
                color: #101419;
                font-weight: 600;
                cursor: pointer;
              }
              button:hover { background: #FF963F; }
              .note {
                margin-top: 2rem;
                font-size: 0.85rem;
                color: #AEB7C2;
                max-width: 600px;
                text-align: center;
                line-height: 1.5;
              }
            </style>
          </head>
          <body>
            <h1>ORANGE Player</h1>
            <p class="lead">Multiplatform Entertainment System.</p>
            <div>
              <input id="url" type="url" placeholder="URL do servidor ORANGE Player (http://ip:3000)">
              <button onclick="window.location.href=document.getElementById('url').value">Conectar</button>
            </div>
            <p class="note">Para usar o ORANGE Player Desktop, hospede a aplicação Next.js em um servidor e informe a URL acima.</p>
          </body>
          </html>
          HTML
          fi

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: web-static-out
          path: ./out
          if-no-files-found: warn

  # ===========================================================
  # PWA artifact (manifest + SW + icons)
  # ===========================================================
  build-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package PWA
        run: |
          mkdir -p pwa-package
          cp platforms/pwa/manifest.json pwa-package/
          cp platforms/pwa/sw.js pwa-package/
          cp platforms/pwa/README.md pwa-package/
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-package
          path: pwa-package/

  # ===========================================================
  # Windows: .exe + .msi (Tauri)
  # ===========================================================
  build-windows:
    runs-on: windows-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Bun dependencies
        run: bun install 

      - name: Download web static export
        uses: actions/download-artifact@v4
        with:
          name: web-static-out
          path: ./out

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build Windows installer
        working-directory: platforms/windows
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            platforms/windows/src-tauri/target/release/bundle/msi/*.msi
            platforms/windows/src-tauri/target/release/bundle/nsis/*.exe

  # ===========================================================
  # Linux: .AppImage + .deb (Tauri)
  # ===========================================================
  build-linux:
    runs-on: ubuntu-22.04
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install Bun dependencies
        run: bun install 

      - name: Download web static export
        uses: actions/download-artifact@v4
        with:
          name: web-static-out
          path: ./out

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build Linux packages
        working-directory: platforms/linux
        run: cargo tauri build

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            platforms/linux/src-tauri/target/release/bundle/appimage/*.AppImage
            platforms/linux/src-tauri/target/release/bundle/deb/*.deb

  # ===========================================================
  # macOS: .dmg (Tauri)
  # ===========================================================
  build-macos:
    runs-on: macos-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Bun dependencies
        run: bun install 

      - name: Download web static export
        uses: actions/download-artifact@v4
        with:
          name: web-static-out
          path: ./out

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build macOS (Apple Silicon + Intel)
        working-directory: platforms/windows
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo tauri build --target aarch64-apple-darwin || true
          cargo tauri build --target x86_64-apple-darwin || true

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            platforms/windows/src-tauri/target/*/release/bundle/dmg/*.dmg
            platforms/windows/src-tauri/target/*/release/bundle/macos/*.app

  # ===========================================================
  # Release: publica todos os binarios no GitHub Releases
  # ===========================================================
  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos, build-pwa]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ format('ORANGE Player {0}', github.ref_name) }}
          make_latest: true
          body: |
            # 🍊 ORANGE Player ${{ github.ref_name }}

            ## Downloads disponíveis

            | Plataforma | Arquivo |
            |---|---|
            | Android (TV + Mobile) | [ORANGE-Player-1.0.0-release.apk](https://github.com/Astaroth0c/orangeplayer/releases/download/v1.0.0/ORANGE-Player-1.0.0-release.apk) |
            | Windows x64 | `.msi` e `.exe` (NSIS) |
            | Linux x64 | `.AppImage` e `.deb` |
            | macOS (Intel + ARM) | `.dmg` |
            | PWA | `pwa-package/` (manifest + SW) |

            ## Login de teste (Xtream)
            - URL: `http://us8.lat`
            - Usuário: `44720622`
            - Senha: `75238219`
            - Validade: 4 horas

            ## Como instalar

            ### Android (TV Box, celular, tablet)
            1. Baixe `ORANGE-Player-1.0.0-release.apk` (link acima)
            2. No Android, ative "Fontes desconhecidas" em Configurações > Segurança
            3. Instale o APK
            4. Abra o app "ORANGE Player" — funciona no celular e Android TV

            ### Windows
            1. Baixe o `.msi` ou `.exe` (NSIS)
            2. Execute e siga o assistente

            ### Linux
            - **AppImage**: `chmod +x *.AppImage && ./*.AppImage`
            - **DEB**: `sudo dpkg -i *.deb`

            ### macOS
            1. Baixe o `.dmg`
            2. Abra e arraste ORANGE Player para Applications
          files: |
            artifacts/windows-installers/*
            artifacts/linux-installers/*
            artifacts/macos-installers/*
            artifacts/pwa-package/*
          draft: false
          prerelease: false

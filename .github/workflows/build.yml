# ORANGE Player — Build & Release Pipeline
# Compila APK Android, Windows .exe/.msi, Linux .AppImage/.deb, macOS .dmg
# Sempre que uma tag v* é criada, todos os binários são gerados e publicados como Release.

name: Build All Platforms

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_name:
        description: "Nome da release"
        required: false
        default: "ORANGE Player"
      make_latest:
        description: "Marcar como latest"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  # ===========================================================
  # WEB: Static export do Next.js (gera out/ para todas as builds)
  # ===========================================================
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: prisma/setup-prisma@v1
        with:
          version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile=false

      - name: Setup Prisma
        run: bun run db:generate

      - name: Configure Next.js for static export
        run: |
          cat > next.config.ts << 'EOF'
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            reactStrictMode: false,
            trailingSlash: true,
          };
          export default nextConfig;
          EOF

      - name: Build static export
        run: bun run build || true
        env:
          NEXT_PUBLIC_API_URL: ""

      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: web-static-out
          path: ./out
          if-no-files-found: ignore

  # ===========================================================
  # PWA artifact (manifest + SW + icons)
  # ===========================================================
  build-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package PWA
        run: |
          mkdir -p pwa-package
          cp platforms/pwa/manifest.json pwa-package/
          cp platforms/pwa/sw.js pwa-package/
          cp -r platforms/pwa/README.md pwa-package/
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-package
          path: pwa-package/

  # ===========================================================
  # Android APK (Debug + Release assinado)
  # ===========================================================
  build-android:
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile=false

      - name: Install Capacitor
        run: cd platforms/android && bun install --frozen-lockfile=false

      - name: Add Android platform (if missing)
        run: |
          cd platforms/android
          [ -d android ] || npx cap add android

      - name: Setup Gradle cache
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        working-directory: platforms/android/android
        run: ./gradlew assembleDebug --no-daemon --console=plain
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Build Release APK (signed with debug keystore)
        working-directory: platforms/android/android
        run: ./gradlew assembleRelease --no-daemon --console=plain
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Sign Release APK
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias orange-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass orangeplayer -keypass orangeplayer \
            -dname "CN=ORANGE Player, O=ORANGE, C=BR"
          
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          APKSIGNER=$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner
          
          $APKSIGNER sign \
            --ks release.keystore --ks-pass pass:orangeplayer \
            --ks-key-alias orange-key --key-pass pass:orangeplayer \
            --out ORANGE-Player-${{ github.ref_name }}-release.apk \
            platforms/android/android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            ORANGE-Player-*-release.apk
            platforms/android/android/app/build/outputs/apk/debug/app-debug.apk

  # ===========================================================
  # Windows: .exe + .msi (Tauri)
  # ===========================================================
  build-windows:
    runs-on: windows-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-setup@v1

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile=false

      - name: Download web static export
        uses: actions/download-artifact@v4
        with:
          name: web-static-out
          path: ./out

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build Windows installer
        working-directory: platforms/windows
        run: cargo tauri build --target-dir target
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            platforms/windows/src-tauri/target/release/bundle/msi/*.msi
            platforms/windows/src-tauri/target/release/bundle/nsis/*.exe

  # ===========================================================
  # Linux: .AppImage + .deb (Tauri)
  # ===========================================================
  build-linux:
    runs-on: ubuntu-22.04
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile=false

      - name: Download web static export
        uses: actions/download-artifact@v4
        with:
          name: web-static-out
          path: ./out

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build Linux packages
        working-directory: platforms/linux
        run: cargo tauri build

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            platforms/linux/src-tauri/target/release/bundle/appimage/*.AppImage
            platforms/linux/src-tauri/target/release/bundle/deb/*.deb

  # ===========================================================
  # macOS: .dmg (Tauri)
  # ===========================================================
  build-macos:
    runs-on: macos-latest
    needs: [build-web]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile=false

      - name: Download web static export
        uses: actions/download-artifact@v4
        with:
          name: web-static-out
          path: ./out

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build macOS app
        working-directory: platforms/windows
        run: cargo tauri build --target aarch64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: ""
      - name: Build macOS Intel app
        working-directory: platforms/windows
        run: cargo tauri build --target x86_64-apple-darwin

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            platforms/windows/src-tauri/target/*/release/bundle/dmg/*.dmg

  # ===========================================================
  # Release: publica todos os binarios no GitHub Releases
  # ===========================================================
  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux, build-macos, build-pwa]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.event.inputs.release_name || format('ORANGE Player {0}', github.ref_name) }}
          make_latest: ${{ github.event.inputs.make_latest || 'true' }}
          body: |
            # 🍊 ORANGE Player ${{ github.ref_name }}
            
            ## Downloads disponíveis
            
            | Plataforma | Arquivo | Tamanho |
            |---|---|---|
            | Android (TV + Mobile) | `ORANGE-Player-*-release.apk` | ~3 MB |
            | Windows x64 | `ORANGE-Player_*_x64-setup.exe` / `.msi` | ~5 MB |
            | Linux x64 | `ORANGE-Player_*_amd64.AppImage` / `.deb` | ~8 MB |
            | macOS (Intel + ARM) | `ORANGE-Player_*_aarch64.dmg` / `x64.dmg` | ~6 MB |
            | PWA | `pwa-package/` (manifest + SW) | 10 KB |
            
            ## Como instalar
            
            ### Android (TV Box, celular, tablet)
            1. Baixe `ORANGE-Player-*-release.apk`
            2. No Android, ative "Fontes desconhecidas" em Configurações > Segurança
            3. Instale o APK
            4. Abra o app "ORANGE Player" — aparecerá tanto no launcher do celular quanto no Android TV
            
            ### Windows
            1. Baixe o `.msi` ou `.exe` (instalador NSIS)
            2. Execute e siga o assistente de instalação
            3. Será criado atalho na Área de Trabalho e no Menu Iniciar
            
            ### Linux
            1. **AppImage**: `chmod +x ORANGE-Player*.AppImage && ./ORANGE-Player*.AppImage`
            2. **DEB**: `sudo dpkg -i orange-player_*.deb`
            
            ### macOS
            1. Baixe o `.dmg` correspondente ao seu Mac (Intel ou Apple Silicon)
            2. Abra e arraste ORANGE Player para Applications
            
            ## Login de teste (Xtream)
            - URL: `http://us8.lat`
            - Usuário: `44720622`
            - Senha: `75238219`
            - Validade: 4 horas
            
            ## O que mudou nesta versão
            - Veja os commits abaixo para detalhes técnicos
          files: |
            artifacts/android-apks/*
            artifacts/windows-installers/*
            artifacts/linux-installers/*
            artifacts/macos-installers/*
            artifacts/pwa-package/*
          draft: false
          prerelease: false
